<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>API Query Builder — Finance Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f0f0f;color:#e5e5e5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 18px;border-bottom:1px solid #222;display:flex;align-items:center;gap:10px;font-size:13px;color:#666;flex-shrink:0}
header strong{color:#e5e5e5;font-size:14px}
.main{display:grid;grid-template-columns:270px 1fr;flex:1;overflow:hidden}
.controls{background:#111;border-right:1px solid #222;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.section-label{font-size:10px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.divider{height:1px;background:#1e1e1e}
.endpoint-group{display:flex;flex-direction:column;gap:5px}
.ep-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s}
.ep-btn:hover{background:#252525;color:#ccc}
.ep-btn.active{background:#6366f1;border-color:#6366f1;color:#fff}
.ep-method{font-size:10px;font-weight:700;background:rgba(255,255,255,.1);padding:1px 5px;border-radius:3px}
.chip-group{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;padding:4px 10px;border-radius:20px;cursor:pointer;font-size:11px;transition:all .15s;user-select:none}
.chip:hover{border-color:#555;color:#ccc}
.chip.on{background:rgba(99,102,241,.15);border-color:#6366f1;color:#a5b4fc}
select{background:#1a1a1a;border:1px solid #2a2a2a;color:#ccc;padding:5px 8px;border-radius:6px;font-size:12px;width:100%;cursor:pointer}
.control-row{display:flex;flex-direction:column;gap:5px}
.control-label{display:flex;justify-content:space-between;font-size:11px;color:#888}
.control-label span{color:#ccc}
input[type=range]{width:100%;accent-color:#6366f1;cursor:pointer}
.toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#888;padding:4px 0}
.toggle{position:relative;width:34px;height:18px}
.toggle input{opacity:0;width:0;height:0}
.slider-t{position:absolute;inset:0;background:#222;border-radius:20px;cursor:pointer;transition:.2s}
.slider-t::before{content:'';position:absolute;width:12px;height:12px;left:3px;top:3px;background:#555;border-radius:50%;transition:.2s}
.toggle input:checked+.slider-t{background:#6366f1}
.toggle input:checked+.slider-t::before{transform:translateX(16px);background:#fff}
.sort-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.sort-dir{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;padding:5px 8px;border-radius:6px;font-size:11px;cursor:pointer}
.sort-dir.asc{color:#10b981;border-color:#10b981}
.sort-dir.desc{color:#f97316;border-color:#f97316}
.right{display:grid;grid-template-rows:1fr 150px;overflow:hidden}
.preview-area{background:#0d1117;overflow:auto;padding:20px;font-family:Consolas,monospace;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:14px}
.url-line{background:#111;border:1px solid #222;border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:nowrap}
.response-box{background:#111;border:1px solid #222;border-radius:8px;padding:14px;overflow:auto;flex:1;white-space:pre;font-size:12px}
.kw{color:#ff7b72}
.str{color:#a5d6ff}
.num{color:#79c0ff}
.prop{color:#d2a8ff}
.punc{color:#8b949e}
.url-method{color:#10b981;font-weight:700}
.url-host{color:#888}
.url-path{color:#a5b4fc}
.url-param{color:#fbbf24}
.url-val{color:#86efac}
.prompt-area{background:#111;border-top:1px solid #222;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.prompt-label{font-size:10px;color:#444;text-transform:uppercase;letter-spacing:.1em}
.prompt-text{font-family:Consolas,monospace;font-size:12px;color:#a5b4fc;line-height:1.5;flex:1;overflow-y:auto;white-space:pre-wrap}
.copy-btn{align-self:flex-start;background:#6366f1;color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;transition:background .15s}
.copy-btn:hover{background:#4f46e5}
.copy-btn.ok{background:#10b981}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <strong>API Query Builder</strong><span>—</span>
  <span>Finance Dashboard · 데이터 탐색 플레이그라운드</span>
</header>
<div class="main">
  <div class="controls">
    <div>
      <div class="section-label">Endpoint</div>
      <div class="endpoint-group">
        <button class="ep-btn active" data-ep="summary"><span class="ep-method">GET</span>/api/summary</button>
        <button class="ep-btn" data-ep="data"><span class="ep-method">GET</span>/api/data</button>
        <button class="ep-btn" data-ep="insights"><span class="ep-method">GET</span>/api/insights</button>
        <button class="ep-btn" data-ep="reload"><span class="ep-method">POST</span>/api/reload</button>
      </div>
    </div>
    <div class="divider"></div>
    <div id="filter-section">
      <div class="section-label">연도</div>
      <select id="year">
        <option value="">전체</option>
        <option value="2022">2022</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
      </select>
    </div>
    <div id="part-section">
      <div class="section-label">파트</div>
      <div class="chip-group" id="parts">
        <div class="chip" data-val="A파트">A파트</div>
        <div class="chip" data-val="B파트">B파트</div>
        <div class="chip" data-val="C파트">C파트</div>
        <div class="chip" data-val="D파트">D파트</div>
        <div class="chip" data-val="E파트">E파트</div>
      </div>
    </div>
    <div id="stage-section">
      <div class="section-label">보고단계</div>
      <div class="chip-group" id="stages">
        <div class="chip" data-val="최종">최종</div>
        <div class="chip" data-val="중간">중간</div>
        <div class="chip" data-val="예비">예비</div>
      </div>
    </div>
    <div id="data-section" class="hidden">
      <div class="divider" style="margin-bottom:14px"></div>
      <div class="section-label">데이터 옵션</div>
      <div class="control-row">
        <div class="control-label">Limit<span id="lv">100</span></div>
        <input type="range" id="limit" min="10" max="500" step="10" value="100">
      </div>
      <div style="margin-top:8px;font-size:11px;color:#888;margin-bottom:4px">정렬 기준</div>
      <div class="sort-row">
        <select id="sortby">
          <option value="revenue">매출</option>
          <option value="operating_profit">경상이익</option>
          <option value="profit_rate">이익율</option>
          <option value="project_code">프로젝트코드</option>
        </select>
        <button class="sort-dir desc" id="sortdir" onclick="toggleSort()">DESC</button>
      </div>
    </div>
    <div id="summary-section">
      <div class="divider" style="margin-bottom:14px"></div>
      <div class="section-label">옵션</div>
      <div class="toggle-row">파트별 분류 포함<label class="toggle"><input type="checkbox" id="bypart" checked><span class="slider-t"></span></label></div>
      <div class="toggle-row">비용 분류 포함<label class="toggle"><input type="checkbox" id="costs" checked><span class="slider-t"></span></label></div>
    </div>
  </div>
  <div class="right">
    <div class="preview-area" id="preview">
      <div class="url-line" id="url-line"></div>
      <div class="response-box" id="response-box"></div>
    </div>
    <div class="prompt-area">
      <div class="prompt-label">생성된 프롬프트</div>
      <div class="prompt-text" id="prompt"></div>
      <button class="copy-btn" id="cpybtn" onclick="copy()">복사</button>
    </div>
  </div>
</div>
<script>
const s={ep:'summary',year:'',parts:[],stages:[],limit:100,sortby:'revenue',sortdir:'desc',bypart:true,costs:true};

const SCHEMA={
  summary:{total_revenue:500000000,total_expenditure:400000000,total_profit:100000000,avg_profit_rate:18.5,count:12,by_part:{'A파트':{revenue:200000000,profit:40000000,count:5}},cost_breakdown:{direct_cost:250000000,labor_cost:100000000,overhead:50000000}},
  data:[{project_code:'P001',year:'2024',part:'A파트',stage:'최종',revenue:100000000,operating_profit:20000000,profit_rate:20.0,filename:'report.xlsx'},'...'],
  insights:{top:[{project_code:'P001',part:'A파트',profit_rate:35.0}],risk:[{project_code:'P010',operating_profit:-5000000}],comments:[{type:'positive',text:'A파트 평균 이익율 우수'}]},
  reload:{ok:true,loaded_at:'2024-07-20 10:00:00',count:42}
};

function buildUrl(){
  const base=`http://localhost:5000/api/${s.ep}`;
  if(s.ep==='reload')return{method:'POST',url:base,params:[]};
  const p=[];
  if(s.year) p.push(['year',s.year]);
  s.parts.forEach(v=>p.push(['part',v]));
  s.stages.forEach(v=>p.push(['stage',v]));
  if(s.ep==='data'){p.push(['limit',s.limit]);p.push(['sort',s.sortby]);p.push(['dir',s.sortdir]);}
  return{method:'GET',url:base,params:p};
}

function renderUrl(){
  const {method,url,params}=buildUrl();
  const qs=params.map(([k,v])=>`${k}=${encodeURIComponent(v)}`).join('&');
  const full=qs?url+'?'+qs:url;
  const [host,path]=full.split('/api/');
  let html=`<span class="url-method">${method}</span> <span class="url-host">${host}/api/</span><span class="url-path">${path.split('?')[0]}</span>`;
  if(params.length){
    html+='<span class="punc">?</span>';
    html+=params.map(([k,v],i)=>(i>0?'<span class="punc">&amp;</span>':'')+`<span class="url-param">${k}</span><span class="punc">=</span><span class="url-val">${encodeURIComponent(v)}</span>`).join('');
  }
  document.getElementById('url-line').innerHTML=html;
}

function fmtJson(obj,indent=0){
  const sp='  '.repeat(indent);
  const sp2='  '.repeat(indent+1);
  if(Array.isArray(obj)){
    if(obj.length===0)return'<span class="punc">[]</span>';
    const items=obj.map(v=>sp2+fmtJson(v,indent+1));
    return`<span class="punc">[</span>\n${items.join('<span class="punc">,</span>\n')}\n${sp}<span class="punc">]</span>`;
  }
  if(typeof obj==='object'&&obj!==null){
    const keys=Object.keys(obj);
    if(keys.length===0)return'<span class="punc">{}</span>';
    const items=keys.map(k=>sp2+`<span class="prop">"${k}"</span><span class="punc">: </span>`+fmtJson(obj[k],indent+1));
    return`<span class="punc">{</span>\n${items.join('<span class="punc">,</span>\n')}\n${sp}<span class="punc">}</span>`;
  }
  if(typeof obj==='string'){
    if(obj==='...')return`<span class="punc">...</span>`;
    return`<span class="str">"${obj}"</span>`;
  }
  if(typeof obj==='number')return`<span class="num">${obj}</span>`;
  if(typeof obj==='boolean')return`<span class="kw">${obj}</span>`;
  return String(obj);
}

function getSchema(){
  if(s.ep==='summary'){
    const r={...SCHEMA.summary};
    if(!s.bypart)delete r.by_part;
    if(!s.costs)delete r.cost_breakdown;
    return r;
  }
  return SCHEMA[s.ep]||{};
}

function renderResponse(){
  document.getElementById('response-box').innerHTML=fmtJson(getSchema());
}

function buildPrompt(){
  const desc=[];
  const epMap={summary:'집계 요약 데이터',data:'원본 프로젝트 데이터 목록',insights:'인사이트 분석 데이터',reload:'엑셀 캐시 강제 재로드'};
  desc.push(`${epMap[s.ep]}를 요청합니다.`);
  const filters=[];
  if(s.year) filters.push(`${s.year}년`);
  if(s.parts.length) filters.push(`${s.parts.join('·')} 필터`);
  if(s.stages.length) filters.push(`${s.stages.join('·')} 단계`);
  if(filters.length) desc.push(`필터: ${filters.join(', ')}.`);
  if(s.ep==='data') desc.push(`최대 ${s.limit}건, ${s.sortby} 기준 ${s.sortdir==='desc'?'내림차순':'오름차순'} 정렬.`);
  if(s.ep==='summary'){
    if(s.bypart) desc.push('파트별 분류 포함.');
    if(s.costs) desc.push('비용 항목(직접원가·인건비·공통원가) 포함.');
  }
  document.getElementById('prompt').textContent=desc.length?`Finance Dashboard API 호출: ${desc.join(' ')} 응답 데이터를 바탕으로 차트 또는 KPI 카드를 렌더링해 주세요.`:'엔드포인트를 선택하고 필터를 설정하면 프롬프트가 생성됩니다.';
}

function updateSections(){
  const isData=s.ep==='data';
  const isSummary=s.ep==='summary';
  const hasFilter=s.ep!=='reload';
  document.getElementById('filter-section').style.display=hasFilter?'':'none';
  document.getElementById('part-section').style.display=hasFilter?'':'none';
  document.getElementById('stage-section').style.display=hasFilter?'':'none';
  document.getElementById('data-section').className=isData?'':'hidden';
  document.getElementById('summary-section').style.display=isSummary?'':'none';
}

function updateAll(){updateSections();renderUrl();renderResponse();buildPrompt();}

// Endpoint buttons
document.querySelectorAll('.ep-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    s.ep=btn.dataset.ep;
    document.querySelectorAll('.ep-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    updateAll();
  });
});

// Year
document.getElementById('year').addEventListener('change',e=>{s.year=e.target.value;updateAll();});

// Chips
function wireChips(containerId,arr){
  document.getElementById(containerId).querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      const v=chip.dataset.val;
      const idx=arr.indexOf(v);
      if(idx===-1){arr.push(v);chip.classList.add('on');}
      else{arr.splice(idx,1);chip.classList.remove('on');}
      updateAll();
    });
  });
}
wireChips('parts',s.parts);
wireChips('stages',s.stages);

// Limit
document.getElementById('limit').addEventListener('input',e=>{s.limit=+e.target.value;document.getElementById('lv').textContent=e.target.value;updateAll();});

// Sort by
document.getElementById('sortby').addEventListener('change',e=>{s.sortby=e.target.value;updateAll();});

function toggleSort(){
  s.sortdir=s.sortdir==='desc'?'asc':'desc';
  const btn=document.getElementById('sortdir');
  btn.textContent=s.sortdir.toUpperCase();
  btn.className='sort-dir '+s.sortdir;
  updateAll();
}

// Summary options
document.getElementById('bypart').addEventListener('change',e=>{s.bypart=e.target.checked;updateAll();});
document.getElementById('costs').addEventListener('change',e=>{s.costs=e.target.checked;updateAll();});

function copy(){
  navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(()=>{
    const b=document.getElementById('cpybtn');b.textContent='복사됨!';b.classList.add('ok');
    setTimeout(()=>{b.textContent='복사';b.classList.remove('ok');},1500);
  });
}

updateAll();
</script>
</body>
</html>
