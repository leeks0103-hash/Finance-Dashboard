<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>프로젝트 재무 대시보드</title>
    <!-- 본문 글꼴 미리 받기 — @font-face가 font-display: optional이라 0.1초 안에 못 받으면 그 페이지 내내
         맑은 고딕으로 굳음(잠금 후 Vite 재연결 새로고침 때 자주). 주소는 src/index.css @font-face와 똑같이.
         외부 CDN(Google Fonts·jsdelivr)은 사내망에서 막혀 있어 안 씀 -->
    <link rel="preload" href="./node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      /* FOUC 방지: React 렌더 전에 테마 적용 */
      (function() {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
